<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Hand Master - AI Vocabulary Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; overflow: hidden; background: #0f172a; color: white; }
        .chinese { font-family: 'Noto Sans SC', sans-serif; }
        canvas { border-radius: 1rem; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
        .video-container { position: relative; width: 100%; max-width: 800px; margin: 0 auto; }
        #input_video { display: none; }
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .reveal-pop { animation: pop 0.25s ease-out; }
    </style>
</head>
<body>

<div id="app" class="flex flex-col items-center justify-center min-h-screen p-4">
    <!-- UI: Loading -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center">
        <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-24 w-24 mb-4"></div>
        <h2 class="text-2xl font-bold">กำลังโหลด AI และคำศัพท์ HSK...</h2>
        <p class="text-gray-400 mt-2">กรุณาอนุญาตให้เข้าถึงกล้องเพื่อเริ่มเล่น</p>
    </div>

    <!-- UI: Start Screen -->
    <div id="start-screen" class="hidden text-center z-40 bg-slate-800/90 p-8 rounded-2xl border border-slate-700 max-w-md">
        <h1 class="text-4xl font-extrabold mb-4 text-blue-400 leading-tight">HSK Hand Master</h1>
        <p class="mb-6 text-gray-300">ใช้มือของคุณ "สัมผัส" คำแปลที่ถูกต้อง เพื่อเก็บคะแนนและทบทวนความรู้</p>
        <div class="grid grid-cols-2 gap-4 mb-8">
            <button onclick="startGame(1)" class="bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-bold transition">HSK 1-2<br><span class="text-xs font-normal opacity-80">300 คำ</span></button>
            <button onclick="startGame(3)" class="bg-emerald-600 hover:bg-emerald-500 p-4 rounded-xl font-bold transition">HSK 3<br><span class="text-xs font-normal opacity-80">299 คำ</span></button>
            <button onclick="startGame(4)" class="bg-amber-600 hover:bg-amber-500 p-4 rounded-xl font-bold transition">HSK 4<br><span class="text-xs font-normal opacity-80">602 คำ</span></button>
            <button onclick="startGame(5)" class="bg-rose-600 hover:bg-rose-500 p-4 rounded-xl font-bold transition">HSK 5<br><span class="text-xs font-normal opacity-80">1,298 คำ</span></button>
        </div>
        <p class="text-sm text-gray-500">แนะนำให้เล่นในที่ที่มีแสงสว่างเพียงพอ</p>
    </div>

    <!-- HUD -->
    <div id="game-hud" class="hidden fixed top-8 left-0 right-0 px-8 flex justify-between items-center z-30 pointer-events-none">
        <div class="bg-slate-800/80 backdrop-blur p-4 rounded-xl border border-slate-700">
            <p class="text-sm text-gray-400">SCORE</p>
            <p id="score-val" class="text-3xl font-bold text-blue-400">0</p>
        </div>
        <div id="target-word-container" class="bg-white p-6 rounded-2xl shadow-2xl transform scale-110">
            <p class="text-slate-500 text-xs text-center mb-1">คำถาม</p>
            <p id="current-word" class="chinese text-5xl font-bold text-slate-900 text-center">--</p>
            <p id="current-pinyin" class="text-center text-slate-500 text-sm italic">--</p>
        </div>
        <div class="bg-slate-800/80 backdrop-blur p-4 rounded-xl border border-slate-700">
            <p class="text-sm text-gray-400">COMBO</p>
            <p id="combo-val" class="text-3xl font-bold text-emerald-400">0</p>
        </div>
    </div>

    <!-- UI: Answer Reveal (shown when the player picks the wrong bubble) -->
    <div id="answer-reveal" class="hidden fixed inset-0 z-40 flex items-center justify-center pointer-events-none">
        <div class="reveal-pop bg-rose-950/95 border-2 border-rose-500 p-8 rounded-2xl shadow-2xl text-center max-w-sm">
            <p class="text-rose-400 font-bold text-lg mb-3">❌ ผิด! เฉลยคำศัพท์</p>
            <p id="reveal-word" class="chinese text-6xl font-bold text-white mb-1">--</p>
            <p id="reveal-pinyin" class="text-slate-300 italic mb-2">--</p>
            <p id="reveal-translation" class="text-2xl font-bold text-amber-300">--</p>
        </div>
    </div>

    <!-- Game Canvas Area -->
    <div class="video-container">
        <video id="input_video"></video>
        <canvas id="output_canvas" width="800" height="600" class="w-full h-auto"></canvas>
    </div>

    <!-- UI: Game Over -->
    <div id="game-over" class="hidden fixed inset-0 bg-slate-900/90 z-50 flex flex-col items-center justify-center">
        <h2 class="text-5xl font-bold text-white mb-2">จบเกม!</h2>
        <p id="final-score" class="text-2xl text-blue-400 mb-8 font-bold">คะแนนของคุณ: 0</p>
        <button onclick="location.reload()" class="bg-blue-600 px-12 py-4 rounded-full font-bold text-xl hover:bg-blue-500 transition shadow-lg">เล่นอีกครั้ง</button>
    </div>
</div>

            { c: '宗教', p: 'zōngjiào', t: 'ศาสนา' },
            { c: '总理', p: 'zǒnglǐ', t: 'นายกรัฐมนตรี' },
            { c: '总算', p: 'zǒngsuàn', t: 'ในที่สุดก็' },
            { c: '总统', p: 'zǒngtǒng', t: 'ประธานาธิบดี' },
            { c: '总之', p: 'zǒngzhī', t: 'โดยสรุปแล้ว' },
            { c: '祖国', p: 'zǔguó', t: 'ปิตุภูมิบ้านเกิด' },
            { c: '组合', p: 'zǔhé', t: 'รวมกันเป็นชุด' },
            { c: '醉', p: 'zuì', t: 'เมา' },
            { c: '最初', p: 'zuìchū', t: 'แรกเริ่ม' },
            { c: '罪犯', p: 'zuìfàn', t: 'ผู้กระทำผิด' },
            { c: '尊敬', p: 'zūnjìng', t: 'เคารพนับถือ' },
            { c: '遵守', p: 'zūnshǒu', t: 'ปฏิบัติตามกฎ' },
            { c: '作品', p: 'zuòpǐn', t: 'ผลงาน' },
            { c: '作为', p: 'zuòwéi', t: 'ในฐานะที่เป็น' },
            { c: '作文', p: 'zuòwén', t: 'เรียงความ' },
            { c: '祖先', p: 'zǔxiān', t: 'บรรพบุรุษ' },
            { c: '阻止', p: 'zǔzhǐ', t: 'ขัดขวางยับยั้ง' },
        ]
    };

    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    let gameState = 'loading';
    let currentScore = 0;
    let combo = 0;
    let currentLevel = 1;
    let currentQuestion = null;
    let bubbles = [];
    let particles = [];
    let handPos = { x: 0, y: 0, active: false };

    // --- Game Logic Classes ---

    class Bubble {
        constructor(text, isCorrect, x) {
            this.text = text;
            this.isCorrect = isCorrect;
            this.x = x;
            this.y = 650;
            this.radius = 60;
            this.speed = 1.5 + Math.random() * 2;
            this.hue = isCorrect ? 200 : Math.random() * 360;
            this.pulse = 0;
            this.layout = this.computeLayout();
        }

        // Wraps this.text into lines and picks the largest font size (shrinking
        // from 20px down to 10px if needed) so the whole label stays inside the
        // circle instead of spilling past its edge.
        computeLayout() {
            const ctx = canvasCtx;
            const maxWidth = this.radius * 1.5;   // safe width inside the circle
            const maxHeight = this.radius * 1.5;  // safe height inside the circle
            const words = this.text.split(' ');
            const minFont = 10;
            const maxFont = 20;
            let best = null;

            for (let fontSize = maxFont; fontSize >= minFont; fontSize--) {
                ctx.font = `bold ${fontSize}px Kanit`;
                const lineHeight = fontSize * 1.15;
                const lines = [];
                let line = '';

                for (const word of words) {
                    const test = line ? `${line} ${word}` : word;
                    if (ctx.measureText(test).width <= maxWidth) {
                        line = test;
                        continue;
                    }
                    if (line) lines.push(line);
                    if (ctx.measureText(word).width <= maxWidth) {
                        line = word;
                    } else {
                        // single word/phrase too wide even alone: hard-wrap by character
                        let chunk = '';
                        for (const ch of word) {
                            const testChunk = chunk + ch;
                            if (chunk && ctx.measureText(testChunk).width > maxWidth) {
                                lines.push(chunk);
                                chunk = ch;
                            } else {
                                chunk = testChunk;
                            }
                        }
                        line = chunk;
                    }
                }
                if (line) lines.push(line);

                const widest = Math.max(...lines.map(l => ctx.measureText(l).width));
                const blockHeight = lines.length * lineHeight;
                const fits = widest <= maxWidth && blockHeight <= maxHeight;

                best = { fontSize, lines, lineHeight };
                if (fits) break; // good enough — stop shrinking further
            }
            return best;
        }

        update() {
            this.y -= this.speed;
            this.pulse += 0.05;
        }

        draw(ctx) {
            const glow = 15 + Math.sin(this.pulse) * 5;
            ctx.shadowBlur = glow;
            ctx.shadowColor = `hsla(${this.hue}, 70%, 50%, 0.6)`;

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, 60%, 20%, 0.8)`;
            ctx.fill();
            ctx.strokeStyle = `hsla(${this.hue}, 80%, 70%, 0.9)`;
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            // Use 'alphabetic' + actual glyph bounding boxes (not the 'middle'
            // baseline, which centers on generic font metrics) so Thai vowels/tone
            // marks that sit above or below the baseline don't throw the text off
            // visual-center — the block ends up truly in the middle of the circle.
            ctx.textBaseline = 'alphabetic';
            const { lines, fontSize } = this.layout;
            ctx.font = `bold ${fontSize}px Kanit`;

            const lineGap = fontSize * 0.3;
            const metrics = lines.map(l => ctx.measureText(l));
            const ascents = metrics.map(m => m.actualBoundingBoxAscent || fontSize * 0.8);
            const descents = metrics.map(m => m.actualBoundingBoxDescent || fontSize * 0.2);
            const totalHeight = ascents.reduce((sum, a, i) => sum + a + descents[i], 0)
                + lineGap * (lines.length - 1);

            let cursorY = this.y - totalHeight / 2;
            lines.forEach((line, i) => {
                cursorY += ascents[i];
                ctx.fillText(line, this.x, cursorY);
                cursorY += descents[i] + lineGap;
            });
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = (Math.random() - 0.5) * 10;
            this.alpha = 1;
            this.color = color;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= 0.02;
        }
        draw(ctx) {
            ctx.globalAlpha = this.alpha;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, 4, 4);
            ctx.globalAlpha = 1;
        }
    }

    // --- MediaPipe Hand Setup ---

    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        
        // Draw Mirror Video
        canvasCtx.translate(canvasElement.width, 0);
        canvasCtx.scale(-1, 1);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
        
        // UI Overlay for Video
        canvasCtx.fillStyle = 'rgba(15, 23, 42, 0.4)';
        canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            // Index Finger Tip is point 8
            const tip = landmarks[8];
            handPos.x = (1 - tip.x) * canvasElement.width; // Flipped because of mirror
            handPos.y = tip.y * canvasElement.height;
            handPos.active = true;

            // Draw Pointer
            canvasCtx.shadowBlur = 20;
            canvasCtx.shadowColor = '#3b82f6';
            canvasCtx.beginPath();
            canvasCtx.arc(tip.x * canvasElement.width, tip.y * canvasElement.height, 15, 0, Math.PI * 2);
            canvasCtx.fillStyle = '#eff6ff';
            canvasCtx.fill();
            canvasCtx.shadowBlur = 0;
        } else {
            handPos.active = false;
        }

        canvasCtx.restore();

        if (gameState === 'playing') {
            updateGame();
        }
    });

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 800,
        height: 600
    });

    camera.start().then(() => {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    });

    // --- Game Logic Functions ---

    function startGame(level) {
        currentLevel = level;
        gameState = 'playing';
        currentScore = 0;
        combo = 0;
        bubbles = [];
        particles = [];
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-hud').classList.remove('hidden');
        nextQuestion();
    }

    function nextQuestion() {
        const pool = hskData[currentLevel];
        currentQuestion = pool[Math.floor(Math.random() * pool.length)];
        
        document.getElementById('current-word').innerText = currentQuestion.c;
        document.getElementById('current-pinyin').innerText = currentQuestion.p;

        // Generate Bubbles
        bubbles = [];
        const correctPos = 150 + Math.random() * 500;
        bubbles.push(new Bubble(currentQuestion.t, true, correctPos));

        // Add 2 distractors: must differ in hanzi AND in translation text from the
        // correct answer (and from each other), so no two bubbles ever show the
        // same Thai text and confuse the player.
        const usedTranslations = new Set([currentQuestion.t]);
        const others = pool.filter(i => i.c !== currentQuestion.c && !usedTranslations.has(i.t));
        for (let i = 0; i < 2 && others.length > 0; i++) {
            const idx = Math.floor(Math.random() * others.length);
            const distractor = others.splice(idx, 1)[0];
            usedTranslations.add(distractor.t);
            bubbles.push(new Bubble(distractor.t, false, 100 + Math.random() * 600));
        }
    }

    function updateGame() {
        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw(canvasCtx);
            if (particles[i].alpha <= 0) particles.splice(i, 1);
        }

        // Update Bubbles
        for (let i = bubbles.length - 1; i >= 0; i--) {
            const b = bubbles[i];
            b.update();
            b.draw(canvasCtx);

            // Collision Detection
            if (handPos.active) {
                const dist = Math.hypot(handPos.x - b.x, handPos.y - b.y);
                if (dist < b.radius + 15) {
                    bubbles.splice(i, 1); // remove first: handleCollision() may replace the whole `bubbles` array
                    handleCollision(b);
                    return;
                }
            }

            // Remove off-screen
            if (b.y < -100) {
                bubbles.splice(i, 1);
                if (b.isCorrect) {
                    combo = 0;
                    document.getElementById('combo-val').innerText = combo;
                    nextQuestion(); // this replaces the `bubbles` array, so stop iterating the old one
                    return;
                }
            }
        }

        if (bubbles.length === 0) nextQuestion();
    }

    function handleCollision(bubble) {
        if (bubble.isCorrect) {
            combo++;
            const points = 10 * combo;
            currentScore += points;
            createExplosion(bubble.x, bubble.y, '#10b981');

            document.getElementById('score-val').innerText = currentScore;
            document.getElementById('combo-val').innerText = combo;
            nextQuestion();
        } else {
            combo = 0;
            currentScore = Math.max(0, currentScore - 20);
            createExplosion(bubble.x, bubble.y, '#f43f5e');

            document.getElementById('score-val').innerText = currentScore;
            document.getElementById('combo-val').innerText = combo;

            // Wrong answer: freeze the game briefly and reveal the correct word for review
            bubbles = [];
            gameState = 'feedback';
            showAnswerReveal(currentQuestion);
            setTimeout(() => {
                hideAnswerReveal();
                gameState = 'playing';
                nextQuestion();
            }, 2000);
        }
    }

    function showAnswerReveal(question) {
        document.getElementById('reveal-word').innerText = question.c;
        document.getElementById('reveal-pinyin').innerText = question.p;
        document.getElementById('reveal-translation').innerText = question.t;
        document.getElementById('answer-reveal').classList.remove('hidden');
    }

    function hideAnswerReveal() {
        document.getElementById('answer-reveal').classList.add('hidden');
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 20; i++) {
            particles.push(new Particle(x, y, color));
        }
    }
</script>
